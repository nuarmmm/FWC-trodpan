<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise1.5</title>
    <style>
        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
        }

        td {
            height: 100px;
            border: 1px solid black;
        }

        .box1 {
            background-color: rgb(112, 179, 228);
        }

        .box2 {
            background-color: rgb(247, 142, 196);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="box1">First cell</td>
            <td class="box2">Second cell</td>
        </tr>
    </table>
</body>
</html>
