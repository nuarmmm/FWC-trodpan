<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise1.6</title>
    <style>
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            padding: 20px;
            word-wrap: break-word;
        }

        .box1 {
            background-color: rgb(112, 179, 228);
        }

        .box2 {
            background-color: rgb(247, 142, 196);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="box1">First cell</td>
            <td class="box2">Second cell</td>
        </tr>
    </table>
</body>
</html>
